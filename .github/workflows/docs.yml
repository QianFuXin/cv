name: Deploy & Release
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install "rendercv[full]"
      - run: mkdir -p ./site
      - run: rendercv render mycv/me_CV.yaml

      - name: Collect outputs
        id: pdf
        run: |
          # find and copy HTML
          HTML=$(find . -path "*/rendercv_output/*.html" -type f | head -1)
          [ -n "$HTML" ] && cp "$HTML" ./site/index.html

          # find and copy PDF
          PDF=$(find . -path "*/rendercv_output/*.pdf" -type f | head -1)
          if [ -z "$PDF" ]; then
            echo "No PDF found" >&2
            exit 1
          fi
          cp "$PDF" ./site/
          echo "pdf=$PDF" >> $GITHUB_OUTPUT
          echo "name=$(basename "$PDF")" >> $GITHUB_OUTPUT

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - uses: actions/deploy-pages@v4
        id: deployment

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }} — ${{ github.event.head_commit.message }}
          files: ${{ steps.pdf.outputs.pdf }}
          generate_release_notes: true
